name: Build & Pack NuGet                # Workflow name shown in Actions UI

on:                                     # Triggers that start the workflow
  push:                                 # Run on git push
    branches: ["**"]                    # ...for pushes to ANY branch (main, master, feature/*, etc.)
    tags: ["v*"]                        # ...and for pushes of tags that start with "v" (e.g., v1.2.3)
  pull_request:                         # Also run for pull requests (build/pack but won’t publish)

jobs:                                   # Collection of jobs in this workflow
  build-pack:                           # A single job named "build-pack"
    runs-on: ubuntu-latest              # Use GitHub-hosted Ubuntu runner

    env:                                # Job-level environment variables
      PACKAGE_NAME: Sample.NuGet.Demo   # 👈 change to match <PackageId> in your .csproj
      PROJECT_PATH: src/Sample.NuGet/Sample.NuGet.csproj  # Path to your .csproj
      ARTIFACTS_DIR: artifacts          # Where we’ll drop .nupkg/.snupkg

    steps:                              # Ordered list of steps in the job
      - name: Checkout
        uses: actions/checkout@v4       # Fetch repo code
        with:
          fetch-tags: true              # Ensure git tags are available for version logic

      - name: Setup .NET
        uses: actions/setup-dotnet@v4   # Install .NET SDK(s)
        with:
          dotnet-version: |             # Multi-line: install both 8.x and 9.x SDKs
            8.x
            9.x

      - name: Restore
        run: dotnet restore             # Restore NuGet packages

      - name: Build (Release)
        run: dotnet build -c Release --no-restore  # Build in Release, skipping restore (already done)

      - name: Determine TAG and VERSION
        id: ver                         # Give this step an ID so later steps can read its outputs
        shell: bash                     # Use bash for the inline script
        run: |                          # Script to compute tag + semver + label
          set -e                        # Exit immediately on error

          # 1) Base TAG (prefer the pushed tag "vX.Y.Z"; else latest tag; else fallback)
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            TAG="${GITHUB_REF_NAME#v}" # If this run was triggered by a tag (e.g., v1.2.3), strip the 'v'
          else
            if git describe --tags --abbrev=0 --match "v*" >/dev/null 2>&1; then
              LATEST="$(git describe --tags --abbrev=0 --match "v*")"  # Find the latest v* tag in repo
              TAG="${LATEST#v}"    # Strip leading 'v'
            else
              TAG="0.0.${GITHUB_RUN_NUMBER}"  # Fallback if no tags exist: 0.0.<run number>
            fi
          fi

          # 2) Is this main/master?
          BRANCH="${GITHUB_REF_NAME}"        # Current ref name (branch or tag name)
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" ]]; then
            VERSION="${TAG}"                 # On main/master → version is <tag> (e.g., 1.2.3)
            FRIENDLY="${{ env.PACKAGE_NAME }}-v${TAG}.nupkg"  # Friendly filename for artifact
          else
            VERSION="${TAG}-pre-release-ci"  # On any other branch → <tag>-pre-release-ci
            FRIENDLY="${{ env.PACKAGE_NAME }}-v${TAG}-pre-release-ci.nupkg"
          fi

          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"   # Expose 'tag' as step output
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"   # Expose 'version' as step output
          echo "friendly=$FRIENDLY" >> "$GITHUB_OUTPUT"   # Expose 'friendly' filename as step output

      - name: Pack
        run: >                                        # Create the NuGet package
          dotnet pack "${PROJECT_PATH}"               # Pack the specified project
          -c Release                                  # Use Release configuration
          -o "${ARTIFACTS_DIR}"                       # Output directory for .nupkg
          /p:PackageVersion=${{ steps.ver.outputs.version }}   # Override version computed above
          /p:ContinuousIntegrationBuild=true          # Deterministic build/source link optimizations
          --no-build                                  # Skip build (we already built)

      - name: Show artifacts
        run: ls -la "${ARTIFACTS_DIR}"               # List generated files for debugging/visibility

      - name: Create friendly-named copy
        shell: bash
        run: |
          set -e
          # The default NuGet file is <PackageId>.<version>.nupkg; compute and copy it with friendly name
          SRC_FILE="$(ls "${ARTIFACTS_DIR}/${PACKAGE_NAME}.${{ steps.ver.outputs.version }}".nupkg)"
          cp "$SRC_FILE" "${ARTIFACTS_DIR}/${{ steps.ver.outputs.friendly }}"
          echo "Created: ${ARTIFACTS_DIR}/${{ steps.ver.outputs.friendly }}"
          # (Optional) if symbols exist, copy them with a friendly name too
          if ls "${ARTIFACTS_DIR}/${PACKAGE_NAME}.${{ steps.ver.outputs.version }}".snupkg >/dev/null 2>&1; then
            cp "${ARTIFACTS_DIR}/${PACKAGE_NAME}.${{ steps.ver.outputs.version }}".snupkg \
               "${ARTIFACTS_DIR}/${PACKAGE_NAME}-v${{ steps.ver.outputs.tag }}.snupkg"
          fi

      - name: Upload artifacts (NuGet packages)
        uses: actions/upload-artifact@v4             # Store build outputs as GitHub Artifacts
        with:
          name: nuget-${{ github.ref_type }}-${{ github.ref_name }}  # Artifact name (contextual)
          path: |                                     # Upload all .nupkg and .snupkg we produced
            ${{ env.ARTIFACTS_DIR }}/*.nupkg
            ${{ env.ARTIFACTS_DIR }}/*.snupkg
          if-no-files-found: error                    # Fail the step if nothing to upload
