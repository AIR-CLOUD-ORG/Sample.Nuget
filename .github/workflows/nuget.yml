name: Build, Package and Publish NuGet

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  DOTNET_VERSION: '8.X'
  BUILD_CONFIGURATION: 'Release'

jobs:

  security-scan:
    name: Security Scan (GitLeaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run Gitleaks
      id: gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional: for commercial use
    - name: Upload Gitleaks SARIF report
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
    - name: Generate Gitleaks summary
      if: always()
      run: |
        echo "## 🔒 Gitleaks Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f results.sarif ]; then
          LEAK_COUNT=$(jq '.runs[0].results | length' results.sarif)
          
          if [ "$LEAK_COUNT" -eq 0 ]; then
            echo "✅ **No secrets or API keys detected!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **WARNING: $LEAK_COUNT potential secret(s) detected!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the security findings in the Security tab." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # List detected secrets (without exposing actual values)
            echo "### Detected Issues:" >> $GITHUB_STEP_SUMMARY
            jq -r '.runs[0].results[] | "- **\(.ruleId)** in `\(.locations[0].physicalLocation.artifactLocation.uri)` (Line: \(.locations[0].physicalLocation.region.startLine))"' results.sarif >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "⚠️ Gitleaks scan completed but no results file generated" >> $GITHUB_STEP_SUMMARY
        fi
    - name: Comment PR with Gitleaks results
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          
          let comment = '## 🔒 Gitleaks Security Scan\n\n';
          
          if ('${{ steps.gitleaks.outcome }}' === 'success') {
            comment += '✅ **No secrets or API keys detected**\n\n';
            comment += 'Your code is clear of hardcoded secrets, API keys, and credentials.\n';
          } else if ('${{ steps.gitleaks.outcome }}' === 'failure') {
            comment += '❌ **SECURITY ALERT: Potential secrets detected!**\n\n';
            comment += '⚠️ Gitleaks has detected potential secrets or API keys in your code.\n\n';
            comment += '**Next steps:**\n';
            comment += '1. Review the [Security tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning) for details\n';
            comment += '2. Remove any hardcoded secrets from your code\n';
            comment += '3. Use environment variables or secure secret management instead\n';
            comment += '4. Consider rotating any exposed credentials\n\n';
            comment += '**Common issues:**\n';
            comment += '- API keys in configuration files\n';
            comment += '- Database connection strings with passwords\n';
            comment += '- Private keys or certificates\n';
            comment += '- Authentication tokens\n';
          }
          
          comment += '\n📊 View detailed results in the [workflow summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})';
          
          // Check if comment already exists
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          
          const existingComment = comments.find(c => c.body.includes('🔒 Gitleaks Security Scan'));
          
          if (existingComment) {
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
