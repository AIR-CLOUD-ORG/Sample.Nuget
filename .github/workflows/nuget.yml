name: Build, Package and Publish NuGet

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  DOTNET_VERSION: '8.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'   # use PR title only
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install tools (format/jq/unzip)
        run: |
          dotnet tool install -g dotnet-format
          sudo apt-get update -y
          sudo apt-get install -y jq unzip

      - name: Restore dependencies
        run: dotnet restore

      - name: Check code formatting
        id: format_check
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true

      - name: Build for validation
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run dotnet pack (dry run)
        id: pack_validation
        run: |
          echo "## NuGet Package Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          mkdir -p ./lint-nupkgs
          for csproj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
            echo "Packing: $csproj"
            dotnet pack "$csproj" --configuration ${{ env.BUILD_CONFIGURATION }} --output ./lint-nupkgs --no-build
          done

          echo "### Generated Packages:" >> $GITHUB_STEP_SUMMARY
          for pkg in ./lint-nupkgs/*.nupkg; do
            if [ -f "$pkg" ]; then
              SIZE=$(du -h "$pkg" | cut -f1)
              echo "- ✅ $(basename "$pkg") ($SIZE)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Analyze package contents
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Contents Analysis:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for pkg in ./lint-nupkgs/*.nupkg; do
            if [ -f "$pkg" ]; then
              echo "#### $(basename "$pkg")" >> $GITHUB_STEP_SUMMARY
              TEMP_DIR=$(mktemp -d)
              unzip -q "$pkg" -d "$TEMP_DIR"

              DLL_COUNT=$(find "$TEMP_DIR" -name "*.dll" | wc -l || true)
              echo "- DLLs: $DLL_COUNT" >> $GITHUB_STEP_SUMMARY

              NUSPEC=$(ls "$TEMP_DIR"/*.nuspec 2>/dev/null | head -n1 || true)
              if [ -n "$NUSPEC" ]; then
                DEP_COUNT=$(grep -c "<dependency " "$NUSPEC" || echo "0")
                echo "- Dependencies: $DEP_COUNT" >> $GITHUB_STEP_SUMMARY
              fi

              SIZE=$(du -h "$pkg" | cut -f1)
              echo "- Size: $SIZE" >> $GITHUB_STEP_SUMMARY

              rm -rf "$TEMP_DIR"
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Check for security vulnerabilities
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          if grep -q "has the following vulnerable packages" vulnerability-report.txt; then
            echo "⚠️ **Vulnerable packages detected!**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat vulnerability-report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No vulnerable packages detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload lint artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-validation-packages
          path: ./lint-nupkgs/

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let comment = '## 🔍 NuGet Package Lint Results\n\n';
            comment += ('${{ steps.format_check.outcome }}' === 'failure')
              ? '❌ **Code formatting issues detected**. Please run `dotnet format`.\n\n'
              : '✅ Code formatting passed\n\n';
            comment += ('${{ steps.pack_validation.outcome }}' === 'success')
              ? '✅ Package creation validation passed\n\n'
              : '❌ **Package creation failed**\n\n';
            comment += `\n📊 View details in the [workflow summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes('🔍 NuGet Package Lint Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id, owner: context.repo.owner, repo: context.repo.repo, body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body: comment
              });
            }

  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: lint
    #if: github.event_name == 'pull_request'   # use PR title only
    if: github.event.pull_request.merged == true  # Only run if PR was merged
    permissions:
      contents: read
      pull-requests: write
      packages: write
    outputs:
      existing_latest_version: ${{ steps.get_version.outputs.existing_latest_version }}
      new_version: ${{ steps.get_version.outputs.new_version }}
    #env:
    #  DOTNET_VERSION: '8.x'
    #  BUILD_CONFIGURATION: 'Release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install jq (needed for API parsing)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      # Parse bump **only from PR TITLE**
      - name: Determine version bump from PR title
        id: commit_bump
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          LOW="$(printf "%s" "$TITLE" | tr '[:upper:]' '[:lower:]')"

          echo "## Version Bump Source" >> $GITHUB_STEP_SUMMARY
          echo "PR Title:" >> $GITHUB_STEP_SUMMARY
          printf "\n\`\`\`\n%s\n\`\`\`\n" "$TITLE" >> $GITHUB_STEP_SUMMARY

          if printf "%s" "$LOW" | grep -Eq '^\s*major\s*:'; then
            BUMP=major
          elif printf "%s" "$LOW" | grep -Eq '^\s*minor\s*:'; then
            BUMP=minor
          elif printf "%s" "$LOW" | grep -Eq '^\s*patch\s*:'; then
            BUMP=patch
          else
            echo "::error title=Missing bump directive::PR title must start with one of: 'major:', 'minor:', or 'patch:' (spaces around ':' allowed)."
            echo "Examples:" >> $GITHUB_STEP_SUMMARY
            echo "- \`major : breaking change\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`minor: add export endpoint\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`patch : update few CS files\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "- Bump: **$BUMP**" >> $GITHUB_STEP_SUMMARY

      # Branch strategy: default branch → stable; others → prerelease suffix
      - name: Determine version strategy
        id: version
        run: |
          DATE=$(date +'%Y%m%d%H%M%S')
          if [[ "${{ github.ref }}" == "refs/heads/master" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            IS_DEFAULT_BRANCH="true"
            echo "version_suffix=" >> $GITHUB_OUTPUT
            echo "build_version_suffix=" >> $GITHUB_OUTPUT
          else
            IS_DEFAULT_BRANCH="false"
            echo "version_suffix=pre-release-$DATE" >> $GITHUB_OUTPUT
            echo "build_version_suffix=--version-suffix pre-release-$DATE" >> $GITHUB_OUTPUT
          fi
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "is_default_branch=$IS_DEFAULT_BRANCH" >> $GITHUB_OUTPUT

      # Get latest version, compute new one, expose outputs; resolve PACKAGE_NAME via MSBuild (no grep)
      - name: Get latest package version & compute new version
        id: get_version
        env:
          BUMP: ${{ steps.commit_bump.outputs.bump }}
          IS_DEFAULT_BRANCH: ${{ steps.version.outputs.is_default_branch }}
        run: |
          echo "## Version Increment Process" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # helper to resolve effective PackageId -> AssemblyName -> file name
          get_pkg_name () {
            local csproj="$1"
            local val
            val="$(dotnet msbuild "$csproj" -nologo -v:quiet -getProperty:PackageId | tr -d '\r')"
            if [ -z "$val" ]; then
              val="$(dotnet msbuild "$csproj" -nologo -v:quiet -getProperty:AssemblyName | tr -d '\r')"
            fi
            if [ -z "$val" ]; then
              val="$(basename "$csproj" .csproj)"
            fi
            printf '%s\n' "$val"
          }

          for csproj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
            PACKAGE_NAME="$(get_pkg_name "$csproj")"
            echo "### Processing: $PACKAGE_NAME" >> $GITHUB_STEP_SUMMARY

            RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${{ github.repository_owner }}/packages/nuget/$PACKAGE_NAME/versions")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)

            if [ "$HTTP_CODE" != "200" ]; then
              RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/users/${{ github.repository_owner }}/packages/nuget/$PACKAGE_NAME/versions")
              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | head -n-1)
            fi

            if [ "$HTTP_CODE" = "200" ]; then
              LATEST_VERSION=$(echo "$BODY" | jq -r 'first(.[] | select(.metadata.package_type == "nuget")) | .name // "0.0.0"')
              echo "- API Status: ✅ Success (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- API Status: ⚠️ Failed (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
              LATEST_VERSION="0.0.0"
            fi

            # Strip pre-release for bump base
            LATEST_VERSION_BASE=$(printf "%s" "$LATEST_VERSION" | sed -E 's/-.*$//')
            if [ "$LATEST_VERSION_BASE" = "0.0.0" ] || [ -z "$LATEST_VERSION_BASE" ]; then
              BASE_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" "$csproj" || echo "1.0.0")
            else
              BASE_VERSION="$LATEST_VERSION_BASE"
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
            PATCH=$(echo "$PATCH" | grep -oE '^[0-9]+' || echo "0")

            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
              minor) NEW_VERSION="$MAJOR.$((MINOR+1)).0" ;;
              patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))" ;;
              *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
            esac

            echo "- Latest Published (raw): \`$LATEST_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "- Latest (base for bump): \`$BASE_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "- New Version (**$BUMP**): \`$NEW_VERSION\`" >> $GITHUB_STEP_SUMMARY

            # Expose outputs
            echo "existing_latest_version=$BASE_VERSION" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

            # Only write <Version> into csproj on default branch
            if [ "$IS_DEFAULT_BRANCH" = "true" ]; then
              if grep -q "<Version>" "$csproj"; then
                sed -i "s|<Version>.*</Version>|<Version>$NEW_VERSION</Version>|" "$csproj"
              else
                sed -i "0,/<PropertyGroup>/s|<PropertyGroup>|<PropertyGroup>\n    <Version>$NEW_VERSION</Version>|" "$csproj"
              fi
              echo "- Action: Updated project version to $NEW_VERSION" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Action: Skipped editing csproj (non-default branch)" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            break  # first (or only) csproj
          done

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Pack NuGet packages
        run: |
          mkdir -p ./nupkgs
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## NuGet Package Creation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for csproj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
            echo "Packing: $csproj"
            if [ "${{ steps.version.outputs.is_default_branch }}" = "true" ]; then
              dotnet pack "$csproj" --configuration ${{ env.BUILD_CONFIGURATION }} --output ./nupkgs --no-build
            else
              dotnet pack "$csproj" --configuration ${{ env.BUILD_CONFIGURATION }} --output ./nupkgs --no-build ${{ steps.version.outputs.build_version_suffix }}
            fi
          done

          for pkg in ./nupkgs/*.nupkg; do
            if [ -f "$pkg" ]; then
              SIZE=$(du -h "$pkg" | cut -f1)
              echo "- ✅ \`$(basename "$pkg")\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: List generated packages
        run: ls -la ./nupkgs/

      - name: Push to GitHub Packages
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Package Publishing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          for pkg in ./nupkgs/*.nupkg; do
            if [ -f "$pkg" ]; then
              echo "Pushing $(basename "$pkg")..."
              if dotnet nuget push "$pkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate 2>&1 | tee push-output.txt; then
                if grep -q "already exists" push-output.txt || grep -q "already been pushed" push-output.txt; then
                  echo "- ⚠️ \`$(basename "$pkg")\`: Already exists (skipped)" >> $GITHUB_STEP_SUMMARY
                else
                  echo "- ✅ \`$(basename "$pkg")\`: Published successfully" >> $GITHUB_STEP_SUMMARY
                fi
              else
                echo "- ❌ \`$(basename "$pkg")\`: Push failed" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
        continue-on-error: ${{ steps.version.outputs.is_default_branch == 'false' }}
