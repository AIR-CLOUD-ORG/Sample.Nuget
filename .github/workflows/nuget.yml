# ---------------------------------------------
# Workflow: Build & Pack a sample NuGet package
# Behavior:
#  - On any branch push → create prerelease artifact named <name>-v<tag>-pre-release-ci.nupkg
#  - On main/master (or on tag push) → artifact named <name>-v<tag>.nupkg
#  - Stores packages as GitHub Artifacts (no external publish)
# ---------------------------------------------
name: Build & Pack NuGet

on:
  push:
    branches: ["**"]     # run for pushes to ANY branch (feature/*, main, master, etc.)
    tags: ["v*"]         # and for annotated/ lightweight tags like v1.2.3
  pull_request:          # PRs get built (artifacts uploaded for inspection)

# (Optional) keep default minimal perms; upload-artifact works with defaults.
permissions:
  contents: read

jobs:
  build-pack:
    runs-on: ubuntu-latest

    # ---- Change these to match your repo ----
    env:
      PACKAGE_NAME: Sample.NuGet.Demo                 # must match <PackageId> in your .csproj
      PROJECT_PATH: src/Sample.NuGet/Sample.NuGet.csproj  # relative path to your .csproj
      ARTIFACTS_DIR: artifacts                        # output folder for .nupkg/.snupkg

    steps:
      # Fetch source + full history + tags (needed for git describe)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0         # full history so 'git describe' works
          fetch-tags: true       # ensure tags are available locally

      # Install .NET SDKs you target (adjust as needed)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x

      # --- (Helpful) Show where we are and confirm project path exists ---
      - name: Validate project path
        shell: bash
        run: |
          set -e
          echo "Repo root: $(pwd)"
          echo "Looking for: $PROJECT_PATH"
          if [[ ! -f "$PROJECT_PATH" ]]; then
            echo "::error ::PROJECT_PATH not found. Update env.PROJECT_PATH to your .csproj"
            echo "Top-level tree:"
            ls -la
            echo "Searching for .csproj up to depth 4:"
            find . -maxdepth 4 -name "*.csproj" -print
            exit 1
          fi

      # Restore packages for the specific project (prevents MSB1003)
      - name: Restore
        run: dotnet restore "${PROJECT_PATH}"

      # Build in Release (skip restore since done above)
      - name: Build (Release)
        run: dotnet build "${PROJECT_PATH}" -c Release --no-restore

      # Work out <tag> and whether this is a release (main/master/tag) or prerelease (other branches)
      - name: Determine TAG and VERSION
        id: ver
        shell: bash
        run: |
          set -e

          # Prefer the pushed tag (vX.Y.Z). Otherwise, use latest v* tag. Fallback to 0.0.<run>.
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            if git describe --tags --abbrev=0 --match "v*" >/dev/null 2>&1; then
              LATEST="$(git describe --tags --abbrev=0 --match "v*")"
              TAG="${LATEST#v}"
            else
              TAG="0.0.${GITHUB_RUN_NUMBER}"
            fi
          fi

          # Decide naming mode:
          #  - If building main/master OR building from a tag → release name (<name>-v<tag>)
          #  - Else (any other branch) → prerelease name (<name>-v<tag>-pre-release-ci)
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${TAG}"                           # semantic version inside the .nupkg
            FRIENDLY="${PACKAGE_NAME}-v${TAG}.nupkg"   # artifact filename you asked for
            FRIENDLY_SYM="${PACKAGE_NAME}-v${TAG}.snupkg"
          else
            VERSION="${TAG}-pre-release-ci"                   # semantic version inside the .nupkg
            FRIENDLY="${PACKAGE_NAME}-v${TAG}-pre-release-ci.nupkg"
            FRIENDLY_SYM="${PACKAGE_NAME}-v${TAG}-pre-release-ci.snupkg"
          fi

          echo "tag=$TAG"                 >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"         >> "$GITHUB_OUTPUT"
          echo "friendly=$FRIENDLY"       >> "$GITHUB_OUTPUT"
          echo "friendly_sym=$FRIENDLY_SYM" >> "$GITHUB_OUTPUT"

      # Create the NuGet package (.nupkg). We override PackageVersion with the value computed above.
      - name: Pack
        run: >
          dotnet pack "${PROJECT_PATH}"
          -c Release
          -o "${ARTIFACTS_DIR}"
          /p:PackageVersion=${{ steps.ver.outputs.version }}
          /p:ContinuousIntegrationBuil
