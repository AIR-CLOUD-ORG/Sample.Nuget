# ---------------------------------------------
# Workflow: Build & Pack a sample NuGet package
# Behavior:
#  - On any branch push → version X.Y.Z-pre-release-ci and artifact <name>-v<tag>-pre-release-ci.nupkg
#  - On main/master (or tag push) → version X.Y.Z and artifact <name>-v<tag>.nupkg
#  - Uploads packages to:
#      1) GitHub Actions Artifacts
#      2) GitHub Packages (NuGet feed)  ← NEW
# ---------------------------------------------
name: Build & Pack NuGet

on:
  push:
    branches: ["**"]     # run for pushes to ANY branch (feature/*, main, master, etc.)
    tags: ["v*"]         # and for tags like v1.2.3
  pull_request:          # PRs get built (artifacts uploaded for inspection)

# Permissions for pushing to GitHub Packages
permissions:
  contents: read
  packages: write

jobs:
  build-pack:
    runs-on: ubuntu-latest

    # ---- Change these to match your repo ----
    env:
      PACKAGE_NAME: Sample.NuGet.Demo                     # must match <PackageId> in your .csproj
      PROJECT_PATH: src/Sample.NuGet/Sample.NuGet.csproj  # relative path to your .csproj
      ARTIFACTS_DIR: artifacts                            # output folder for .nupkg/.snupkg

    steps:
      # Fetch source + full history + tags (needed for git describe)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Install .NET SDKs you target (adjust as needed)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x

      # --- (Helpful) Verify project path exists ---
      - name: Validate project path
        shell: bash
        run: |
          set -e
          echo "Repo root: $(pwd)"
          echo "Looking for: $PROJECT_PATH"
          if [[ ! -f "$PROJECT_PATH" ]]; then
            echo "::error ::PROJECT_PATH not found. Update env.PROJECT_PATH to your .csproj"
            ls -la
            find . -maxdepth 4 -name "*.csproj" -print
            exit 1
          fi

      # Restore & build the specific project (prevents MSB1003)
      - name: Restore
        run: dotnet restore "${PROJECT_PATH}"

      - name: Build (Release)
        run: dotnet build "${PROJECT_PATH}" -c Release --no-restore

      # Compute <tag> and version flavor
      - name: Determine TAG and VERSION
        id: ver
        shell: bash
        run: |
          set -e
          # Prefer pushed tag vX.Y.Z → X.Y.Z; else latest v* tag; else 0.0.<run>
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            if git describe --tags --abbrev=0 --match "v*" >/dev/null 2>&1; then
              LATEST="$(git describe --tags --abbrev=0 --match "v*")"
              TAG="${LATEST#v}"
            else
              TAG="0.0.${GITHUB_RUN_NUMBER}"
            fi
          fi

          # main/master or tag → release; other branches → pre-release-ci
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${TAG}"
            FRIENDLY="${PACKAGE_NAME}-v${TAG}.nupkg"
            FRIENDLY_SYM="${PACKAGE_NAME}-v${TAG}.snupkg"
          else
            VERSION="${TAG}-pre-release-ci"
            FRIENDLY="${PACKAGE_NAME}-v${TAG}-pre-release-ci.nupkg"
            FRIENDLY_SYM="${PACKAGE_NAME}-v${TAG}-pre-release-ci.snupkg"
          fi

          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "friendly=$FRIENDLY"         >> "$GITHUB_OUTPUT"
          echo "friendly_sym=$FRIENDLY_SYM" >> "$GITHUB_OUTPUT"

      # Create the NuGet package (.nupkg). Override PackageVersion with computed value.
      - name: Pack
        run: >
          dotnet pack "${PROJECT_PATH}"
          -c Release
          -o "${ARTIFACTS_DIR}"
          /p:PackageVersion=${{ steps.ver.outputs.version }}
          /p:ContinuousIntegrationBuild=true
          --no-build

      - name: Show artifacts
        run: ls -la "${ARTIFACTS_DIR}"

      # Friendly file names for easy download from Artifacts
      - name: Create friendly-named copies
        shell: bash
        run: |
          set -e
          SRC_NUPKG="${ARTIFACTS_DIR}/${PACKAGE_NAME}.${{ steps.ver.outputs.version }}.nupkg"
          if [[ ! -f "$SRC_NUPKG" ]]; then
            echo "::error ::Expected package not found: $SRC_NUPKG"
            ls -la "${ARTIFACTS_DIR}" || true
            exit 1
          fi
          cp "$SRC_NUPKG" "${ARTIFACTS_DIR}/${{ steps.ver.outputs.friendly }}"
          echo "Created friendly: ${ARTIFACTS_DIR}/${{ steps.ver.outputs.friendly }}"
          SRC_SNUPKG="${ARTIFACTS_DIR}/${PACKAGE_NAME}.${{ steps.ver.outputs.version }}.snupkg"
          if [[ -f "$SRC_SNUPKG" ]]; then
            cp "$SRC_SNUPKG" "${ARTIFACTS_DIR}/${{ steps.ver.outputs.friendly_sym }}"
            echo "Created friendly symbols: ${ARTIFACTS_DIR}/${{ steps.ver.outputs.friendly_sym }}"
          fi

      # Upload to GitHub Actions Artifacts (downloadable from the run)
      - name: Upload artifacts (NuGet packages)
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ github.ref_type }}-${{ github.ref_name }}
          path: |
            ${{ env.ARTIFACTS_DIR }}/*.nupkg
            ${{ env.ARTIFACTS_DIR }}/*.snupkg
          if-no-files-found: error

      # ---------------------------
      # Publish to GitHub Packages (NuGet feed) using the repo's GITHUB_TOKEN.
      # Runs only on 'push' (branches & tags), not on pull_request.
      # Consumers will need a nuget.config pointing to:
      #   https://nuget.pkg.github.com/<OWNER>/index.json
      # ---------------------------
      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${GH_TOKEN}" \
            --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/${OWNER}/index.json"

          dotnet nuget push "${ARTIFACTS_DIR}/*.nupkg" \
            --source "github" \
            --api-key "${GH_TOKEN}" \
            --skip-duplicate
